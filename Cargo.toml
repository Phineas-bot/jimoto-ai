[workspace]
members = [
    "crates/gixgiz-contracts",
    "crates/gixgiz-core",
    "crates/gixgiz-desktop-host",
    "crates/gixgiz-persistence",
    "crates/gixgiz-runtime",
    "crates/gixgiz-runtime-ollama",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/Phineas-bot/gixgiz"

[workspace.dependencies]
axum = { version = "0.8.6", default-features = false, features = ["http1", "json", "tokio"] }
bytes = "1.10.1"
http-body-util = "0.1.3"
hyper = { version = "1.7.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.17", default-features = false, features = ["tokio"] }
schemars = { version = "1.2.2", features = ["uuid1"] }
semver = "1.0.27"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
rusqlite = { version = "0.40.1", default-features = false, features = ["backup", "bundled"] }
tempfile = "3.27.0"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.17"
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["fmt"] }
uuid = { version = "1.16.0", features = ["serde", "v4"] }
