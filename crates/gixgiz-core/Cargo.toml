[package]
name = "gixgiz-core"
description = "Platform lifecycle, readiness policy, and operation conventions for GixGiz."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gixgiz-contracts = { path = "../gixgiz-contracts" }
gixgiz-persistence = { path = "../gixgiz-persistence" }
gixgiz-runtime = { path = "../gixgiz-runtime" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
gixgiz-runtime = { path = "../gixgiz-runtime", features = ["test-support"] }
# Test-only: seeds the catalogue row a completed setup would have written, so
# chat tests can bind a verified model. Production core never touches SQL.
rusqlite.workspace = true
tempfile.workspace = true
